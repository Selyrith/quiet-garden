<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F1E6" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Quiet Garden</title>
  <meta name="description" content="Quiet Garden — кооперативный антистресс-сад для 2-4 игроков. Выращивайте растения, открывайте виды, собирайте урожай вместе." />
  <meta property="og:title" content="Quiet Garden" />
  <meta property="og:description" content="Кооперативный антистресс-сад для 2-4 игроков" />
  <meta property="og:type" content="website" />
  <style>
    /*
     * Палитра и типографика: design/reference/DESIGN-SPEC.md (Dawnfield).
     * Forest #3D7A52 — главное действие, Wheat #E8C55A — вторичное,
     * Terracotta #C2654A — деструктив. Ни чистого #000, ни чистого #FFF.
     * База сетки 8dp, touch target 56dp, радиус панелей 24px.
     */
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;500;600;700;800&display=swap');

    :root {
      /* Тёплые нейтрали (60%) */
      --bg-primary: #F7F1E6;      /* Sunlit Cream */
      --bg-secondary: #F1E8D8;
      --panel-bg: #FCF8F0;        /* --card */
      --panel-bg-strong: #FFFDF8;
      --border-light: #E6DCCC;    /* --border */
      --text-primary: #3D2E20;    /* Rich Soil */
      --text-secondary: #8A7A66;

      /* Зелень (30%) */
      --accent-leaf: #3D7A52;     /* Forest */
      --accent-leaf-dark: #356444;
      --accent-leaf-light: #DCE9DE;

      /* Акценты (10%) */
      --accent-wheat: #E8C55A;
      --accent-terracotta: #C2654A;
      --accent-sky: #7BBAD4;
      --accent-petal: #D48EA3;

      /* Роли элементов */
      --btn-primary-start: #468A5D;
      --btn-primary-end: #3D7A52;
      --btn-primary-pressed: #2C5438;
      --btn-secondary-bg: #E8C55A;
      --overlay: rgba(61, 46, 32, 0.54);
      --focus-ring: rgba(232, 197, 90, 0.28);

      /* Геометрия */
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --touch-min: 56px;

      /* Тени тёплые (Rich Soil), не чёрные */
      --shadow-soft: rgba(92, 69, 50, 0.10);
      --shadow-card: rgba(92, 69, 50, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-primary);
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text-primary);
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .display { font-family: 'Lilita One', 'Nunito', cursive; font-weight: 400; }

    #game-container {
      width: 100vw; height: 100vh; height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
      z-index: 10;
    }

    /*
     * DOM-слой Phaser (в нём живут поля ввода: ответ питомцу, записка у
     * указателя). Phaser добавляет этот div в родителя РАНЬШЕ canvas, поэтому
     * без z-index слой оказывается ПОД игрой — окно выглядит пустым, а поле
     * ввода не видно и не получает фокус. Поднимаем над canvas.
     */
    #game-container > div {
      z-index: 20;
    }
    #game-container > canvas {
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(at 25% 25%, #FFFDF8 0%, var(--bg-primary) 60%),
        radial-gradient(at 75% 75%, #F1E8D8 0%, var(--bg-primary) 60%);
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: fixed; inset: 0;
      background: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; width: 100%; height: 100%;
    }
    .screen.hidden { display: none; }

    .screen .container {
      background: linear-gradient(180deg, var(--panel-bg-strong), var(--panel-bg));
      backdrop-filter: blur(16px);
      width: 100%; max-width: 460px; padding: 40px 28px;
      border-radius: var(--radius-lg); box-shadow:
        0 24px 54px var(--shadow-card),
        0 0 0 2px var(--border-light);
      border: none;
    }

    .title {
      font-family: 'Lilita One', 'Nunito', cursive;
      font-size: clamp(1.9rem, 6.4vw, 2.6rem);
      color: var(--text-primary);
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(92, 69, 50, 0.18);
    }
    .subtitle {
      font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      color: var(--text-secondary); margin-bottom: 32px; font-weight: 500;
    }

    .slots-container {
      display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px;
      margin-top: 4px;
    }

    .slot {
      background: var(--panel-bg-strong);
      border: 2px solid var(--border-light); border-radius: var(--radius-md);
      min-height: var(--touch-min);
      padding: 20px; display: flex; justify-content: space-between; align-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer; text-align: left; position: relative;
      box-shadow: 0 4px 12px var(--shadow-soft);
    }
    .slot:hover {
      border-color: var(--accent-leaf);
      box-shadow: 0 8px 20px var(--shadow-card);
      transform: translateY(-2px);
    }
    .slot:active { transform: scale(0.985); background: var(--bg-secondary); }

    .slot.empty {
      border-style: dashed; background: var(--accent-leaf-light); border-color: var(--accent-leaf);
    }
    .slot.empty:hover { background: #CFE0D2; }

    .slot-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .slot-title { color: var(--text-primary); font-size: 16px; font-weight: 800; font-family: 'Nunito', sans-serif; }
    .slot-sub { color: var(--text-secondary); font-size: 12px; font-weight: 500; }

    .slot-delete {
      position: absolute; top: 8px; right: 8px; background: none;
      color: var(--text-secondary); border: none; cursor: pointer;
      font-size: 12px; font-weight: 700; transition: all 0.2s;
      min-width: 44px; min-height: 44px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .slot-delete:hover { color: var(--accent-terracotta); background: rgba(194, 101, 74, 0.10); }
    .slot-delete:focus-visible { outline: 3px solid var(--accent-wheat); outline-offset: 2px; }

    .join-area {
      margin-top: 32px; width: 100%; max-width: 380px;
    }
    .nick-input {
      width: 100%; min-width: 0; min-height: var(--touch-min);
      padding: 16px 18px; font-size: 16px;
      border: 2px solid var(--border-light); border-radius: var(--radius-md);
      background: var(--panel-bg-strong); color: var(--text-primary); font-weight: 600;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nick-input:focus, .code-input:focus, .note-editor input[type="text"]:focus {
      border-color: var(--accent-leaf); box-shadow: 0 0 0 4px var(--focus-ring);
    }
    .nick-input::placeholder { color: var(--text-secondary); font-size: 15px; }
    .input-row {
      display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }

    .code-input {
      width: 100%; min-width: 0; min-height: var(--touch-min);
      padding: 18px 20px; font-size: 20px; letter-spacing: 4px;
      text-transform: uppercase; border: 2px solid var(--border-light);
      border-radius: var(--radius-md); font-family: 'Nunito', monospace; outline: none;
      background: var(--panel-bg-strong); color: var(--text-primary); font-weight: 800;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .code-input:focus { border-color: var(--accent-leaf); box-shadow: 0 0 0 4px var(--focus-ring); }

    /* Primary action: Forest green + 2px emboss («вдавленная доска») */
    .btn-join {
      width: 100%; min-height: var(--touch-min); padding: 16px 22px; font-size: 18px;
      background: linear-gradient(180deg, var(--btn-primary-start), var(--btn-primary-end));
      color: var(--panel-bg-strong);
      border: none;
      border-bottom: 3px solid var(--btn-primary-pressed);
      border-radius: var(--radius-md); cursor: pointer;
      font-family: 'Lilita One', 'Nunito', cursive; letter-spacing: 0.4px;
      box-shadow: 0 6px 14px var(--shadow-soft);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    .btn-join:active {
      transform: translateY(2px);
      background: var(--btn-primary-pressed);
      border-bottom-width: 1px;
      box-shadow: 0 2px 6px var(--shadow-soft);
    }
    .btn-join:hover { filter: brightness(1.05); box-shadow: 0 10px 22px var(--shadow-card); }

    .btn-join:focus-visible, .slot:focus-visible, .slot-delete:focus-visible, .note-btn:focus-visible {
      outline: 3px solid var(--accent-wheat); outline-offset: 3px;
    }

    .error {
      color: var(--accent-terracotta); font-size: 13px; margin-top: 6px; min-height: 20px;
      font-weight: 700; margin-bottom: 4px;
    }

    .note-editor {
      position: relative;
      background: var(--panel-bg);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 26px 30px;
      box-shadow: 0 20px 40px var(--shadow-card);
      display: flex; flex-direction: column; gap: 16px;
      font-family: 'Nunito', sans-serif;
    }
    .note-title {
      color: var(--accent-leaf-dark); font-family: 'Lilita One', 'Nunito', cursive;
      font-size: 16px; text-align: center;
    }
    .note-editor input[type="text"] {
      width: 100%; min-height: var(--touch-min);
      padding: 16px 20px;
      font-size: 16px;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--panel-bg-strong); color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .note-editor input[type="text"]:focus { border-color: var(--accent-leaf); box-shadow: 0 0 0 4px var(--focus-ring); }
    .note-btns { display: flex; gap: 10px; justify-content: center; }
    .note-btn {
      flex: 1; min-height: var(--touch-min); padding: 12px 16px;
      font-size: 15px; font-weight: 700;
      border: none; border-radius: var(--radius-md); cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    .note-btn:active { transform: translateY(2px); }
    .note-btn-save {
      background: linear-gradient(180deg, var(--btn-primary-start), var(--btn-primary-end));
      color: var(--panel-bg-strong);
      border-bottom: 3px solid var(--btn-primary-pressed);
    }
    .note-btn-save:hover { filter: brightness(1.05); }
    .note-btn-cancel {
      background: var(--panel-bg-strong);
      color: var(--text-primary);
      border: 2px solid var(--border-light);
    }
    .note-btn-cancel:hover { border-color: var(--accent-wheat); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div class="screen" id="menuScreen">
    <div class="container">
      <div class="title">Quiet Garden</div>
      <div class="subtitle">Выберите сад или создайте новый</div>

      <div class="slots-container" id="slotsContainer">
        <!-- Слоты будут сгенерированы через JS -->
      </div>

      <div class="join-area">
        <div style="margin-bottom: 16px;">
          <input class="nick-input" id="nickInput" type="text" maxlength="20" placeholder="Ваше имя" autocomplete="off" />
        </div>
        <div class="input-row">
          <button class="btn-join" id="joinBtn">Войти</button>
          <input class="code-input" id="codeInput" type="text" maxlength="6" placeholder="КОД ДРУГА" autocomplete="off" />
        </div>
        <div class="error" id="joinError"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
