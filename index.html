<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F0E8" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Quiet Garden</title>
  <meta name="description" content="Quiet Garden — кооперативный антистресс-сад для 2-4 игроков. Выращивайте растения, открывайте виды, собирайте урожай вместе." />
  <meta property="og:title" content="Quiet Garden" />
  <meta property="og:description" content="Кооперативный антистресс-сад для 2-4 игроков" />
  <meta property="og:type" content="website" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-primary: #F9F5EE;
      --bg-secondary: #F2E9DA;
      --accent-rose: #E3B5A8;
      --accent-peach: #F0C9AE;
      --accent-sage: #B9C8A6;
      --accent-earth: #C4A684;
      --accent-leaf: #A8D593;
      --text-primary: #5c4a3a;
      --text-secondary: #8e7b63;
      --border-light: #e6dcc9;
      --tile-green: #B8D8B8;
      --tile-hover: #F3EFE4;
      --btn-primary-start: #e8c3a8;
      --btn-primary-end: #d8a494;
      --btn-primary-pressed: #c9a884;
      --btn-secondary-bg: #b8c4a6;
      --panel-bg: #f8f4ee;
      --panel-bg-strong: #ffffff;
      --overlay: rgba(35, 25, 18, 0.54);
      --focus-ring: rgba(185, 200, 166, 0.22);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-soft: rgba(96, 80, 66, 0.10);
      --shadow-card: rgba(96, 80, 66, 0.16);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-primary);
      font-family: 'Nunito', 'Inter', system-ui, sans-serif;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      width: 100vw; height: 100vh; height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
      z-index: 10;
    }

    /*
     * DOM-слой Phaser (в нём живут поля ввода: ответ питомцу, записка у
     * указателя). Phaser добавляет этот div в родителя РАНЬШЕ canvas, поэтому
     * без z-index слой оказывается ПОД игрой — окно выглядит пустым, а поле
     * ввода не видно и не получает фокус. Поднимаем над canvas.
     */
    #game-container > div {
      z-index: 20;
    }
    #game-container > canvas {
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(at 25% 25%, #FFF8EF 0%, var(--bg-primary) 60%),
        radial-gradient(at 75% 75%, #F2E9DA 0%, var(--bg-primary) 60%);
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: fixed; inset: 0;
      background: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; width: 100%; height: 100%;
    }
    .screen.hidden { display: none; }

    .screen .container {
      background: linear-gradient(180deg, rgba(255,255,255,0.90), rgba(248,244,238,0.96));
      backdrop-filter: blur(16px);
      width: 100%; max-width: 460px; padding: 40px 28px;
      border-radius: 28px; box-shadow:
        0 24px 54px var(--shadow-card),
        0 0 0 1px var(--border-light);
      border: none;
    }

    .title {
      font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: clamp(1.8rem, 6vw, 2.4rem);
      color: var(--text-primary); letter-spacing: -0.02em;
      margin-bottom: 6px; text-shadow: 0 2px 6px rgba(201, 168, 132, 0.25);
    }
    .subtitle {
      font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      color: var(--text-secondary); margin-bottom: 32px; font-weight: 400;
    }

    .slots-container {
      display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px;
      margin-top: 4px;
    }

    .slot {
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid var(--border-light); border-radius: var(--radius-lg);
      padding: 20px; display: flex; justify-content: space-between; align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer; text-align: left; position: relative;
      box-shadow: 0 8px 20px var(--shadow-soft);
    }
    .slot:hover {
      border-color: var(--btn-primary-end);
      box-shadow: 0 14px 28px var(--shadow-soft);
      transform: translateY(-2px);
    }
    .slot:active { transform: scale(0.985); background: rgba(248, 244, 238, 0.96); }

    .slot.empty {
      border-style: dashed; background: rgba(184, 196, 166, 0.10); border-color: var(--btn-secondary-bg);
    }
    .slot.empty:hover { background: rgba(184, 196, 166, 0.16); }

    .slot-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .slot-title { color: var(--text-primary); font-size: 16px; font-weight: 700; font-family: 'Nunito', sans-serif; }
    .slot-sub { color: var(--text-secondary); font-size: 12px; }

    .slot-delete {
      position: absolute; top: 12px; right: 12px; background: none;
      color: var(--text-secondary); border: none; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all 0.2s;
      padding: 6px 8px; border-radius: 10px;
    }
    .slot-delete:hover { color: var(--accent-earth); background: rgba(196, 166, 132, 0.1); }
    .slot-delete:focus { outline: 2px solid var(--accent-earth); outline-offset: 2px; }

    .join-area {
      margin-top: 32px; width: 100%; max-width: 380px;
    }
    .nick-input {
      width: 100%; min-width: 0;
      padding: 16px 18px; font-size: 16px;
      border: 2px solid var(--border-light); border-radius: 20px;
      background: rgba(255,255,255,0.92); color: var(--text-primary); font-weight: 600;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nick-input:focus, .code-input:focus, .note-editor input[type="text"]:focus { border-color: var(--btn-secondary-bg); box-shadow: 0 0 0 4px var(--focus-ring); }
    .nick-input::placeholder { color: var(--text-secondary); font-size: 15px; }
    .input-row {
      display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }

    .code-input {
      width: 100%; min-width: 0;
      padding: 18px 20px; font-size: 20px; letter-spacing: 4px;
      text-transform: uppercase; border: 2px solid var(--border-light);
      border-radius: 20px; font-family: 'Nunito', monospace; outline: none;
      background: rgba(255,255,255,0.92); color: var(--text-primary); font-weight: 800;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .code-input:focus { border-color: var(--btn-secondary-bg); box-shadow: 0 0 0 4px var(--focus-ring); }

    .btn-join {
      width: 100%; min-height: 56px; padding: 16px 22px; font-size: 18px;
      background: linear-gradient(180deg, var(--btn-primary-start), var(--btn-primary-end));
      color: #FFFFFF; border: 1px solid rgba(201, 168, 132, 0.55); border-radius: var(--radius-md); cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 700; white-space: nowrap;
      box-shadow: 0 10px 20px var(--shadow-soft); transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }
    .btn-join:active { transform: scale(0.98); background: var(--btn-primary-pressed); box-shadow: 0 4px 10px var(--shadow-soft); }
    .btn-join:hover { filter: brightness(1.03); box-shadow: 0 14px 28px var(--shadow-card); }

    .btn-join:focus-visible, .slot:focus-visible, .slot-delete:focus-visible, .note-btn:focus-visible {
      outline: 3px solid var(--btn-secondary-bg); outline-offset: 3px;
    }

    .error {
      color: var(--accent-earth); font-size: 13px; margin-top: 6px; min-height: 20px;
      font-weight: 500; margin-bottom: 4px;
    }

    .note-editor {
      position: relative;
      background: rgba(248, 244, 238, 0.96);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 26px 30px;
      box-shadow: 0 20px 40px var(--shadow-card);
      display: flex; flex-direction: column; gap: 16px;
      font-family: 'Nunito', sans-serif;
    }
    .note-title {
      color: var(--btn-primary-end); font-weight: 800; font-size: 14px;
      font-family: 'Nunito', sans-serif; text-align: center;
    }
    .note-editor input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      border: 2px solid var(--border-light);
      border-radius: 16px;
      background: rgba(255,255,255,0.92); color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .note-editor input[type="text"]:focus { border-color: var(--btn-secondary-bg); box-shadow: 0 0 0 4px var(--focus-ring); }
    .note-btns { display: flex; gap: 10px; justify-content: center; }
    .note-btn {
      flex: 1; min-height: 44px; padding: 12px 16px;
      font-size: 14px; font-weight: 800;
      border: none; border-radius: 16px; cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .note-btn:active { transform: scale(0.98); }
    .note-btn-save {
      background: linear-gradient(180deg, #c7d8b8, var(--btn-secondary-bg));
      color: #3f523f;
    }
    .note-btn-save:hover { background: linear-gradient(180deg, var(--btn-secondary-bg), #a8b89a); box-shadow: 0 6px 14px rgba(96, 80, 66, 0.16); }
    .note-btn-cancel {
      background: linear-gradient(180deg, #e8c3a8, var(--btn-primary-end));
      color: #5c4a3a;
    }
    .note-btn-cancel:hover { background: linear-gradient(180deg, var(--btn-primary-end), var(--btn-primary-pressed)); box-shadow: 0 6px 14px rgba(96, 80, 66, 0.16); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div class="screen" id="menuScreen">
    <div class="container">
      <div class="title">Quiet Garden</div>
      <div class="subtitle">Выберите сад или создайте новый</div>

      <div class="slots-container" id="slotsContainer">
        <!-- Слоты будут сгенерированы через JS -->
      </div>

      <div class="join-area">
        <div style="margin-bottom: 16px;">
          <input class="nick-input" id="nickInput" type="text" maxlength="20" placeholder="Ваше имя" autocomplete="off" />
        </div>
        <div class="input-row">
          <button class="btn-join" id="joinBtn">Войти</button>
          <input class="code-input" id="codeInput" type="text" maxlength="6" placeholder="КОД ДРУГА" autocomplete="off" />
        </div>
        <div class="error" id="joinError"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
